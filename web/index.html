<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HelioSpan Monitor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#/">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="currentColor" />
            <path d="M7 22h18" stroke="#1a1208" stroke-width="2" stroke-linecap="round" />
            <path d="M9 22a7 7 0 0 1 14 0" fill="none" stroke="#1a1208" stroke-width="2" />
            <circle cx="16" cy="13" r="2.2" fill="#1a1208" />
          </svg>
          <span class="brand-text">
            <strong>HelioSpan</strong>
            <em>Monitor</em>
          </span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="#/" data-nav="fleet">Fleet</a>
          <a href="#/alerts" data-nav="alerts">
            Alerts
            <span class="count" data-k="header-alerts" data-tone-k="header-alerts:tone" data-tone="ok">–</span>
          </a>
        </nav>
        <div class="statusline">
          <span class="live"><span class="pulse" aria-hidden="true"></span> Live</span>
          <span class="mono dim" data-k="header-tick"></span>
        </div>
      </header>
      <main id="view" class="view">
        <p class="loading">Loading the fleet…</p>
      </main>
    </div>
    <script src="/assets/app.js" type="module"></script>
  </body>
</html>
